<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Oliva Pizzeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Cabin+Condensed:wght@500;600&family=Josefin+Sans:wght@300;400&family=Kaushan+Script&family=Caveat:wght@400;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f5; }
  canvas { display: block; }
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20, 30, 20, .45);
    color: #fff; cursor: pointer; user-select: none;
    font-family: "Fredoka", Arial, sans-serif;
  }
  #start .big {
    font-size: 40px; font-weight: 600;
    background: #5fae4a; padding: 14px 40px; border-radius: 14px;
    box-shadow: 0 6px 0 #3e7d2e;
  }
  #start .keys { margin-top: 26px; font-size: 17px; opacity: .95; text-align: center; line-height: 1.8; }
  #start kbd {
    font-family: inherit; background: #fff; color: #222; border-radius: 6px;
    padding: 1px 9px; box-shadow: 0 3px 0 #999; margin: 0 3px;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 600 22px Fredoka, Arial; background: #2b3a2b; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="loading">Pizzeria wird gebacken</div>
<div id="start" style="display:none">
  <div class="big">Klicken zum Starten</div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> laufen &nbsp; <kbd>Shift</kbd> rennen &nbsp; <kbd>Leertaste</kbd> springen<br>
    Maus umsehen &nbsp; Mausrad zoomen &nbsp; <kbd>Esc</kbd> Pause
  </div>
</div>

<script type="module">
import * as THREE from "three";

const BW = 11, BD = 8, BH = 9.8, WT = 0.3;
const GREEN = "#6cbf55", INK = "#2a2a2a", DESC = "#3d8530";
const F_HEAD = '"Amatic SC"', F_ITEM = '"Cabin Condensed"', F_LOGO = '"Josefin Sans"', F_SCRIPT = '"Kaushan Script"', F_CHALK = '"Caveat"';

const PIZZE = [
  ["Marinara*", "8", "hausgemachte Tomatensauce | Knoblauch | Oregano | Basilikum"],
  ["Margherita*", "9,5", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | Basilikum"],
  ["Provola e Pepe*", "9,5", "hausgemachte Tomatensauce | Provola affumicata | Pfeffer"],
  ["Bufala", "13,5", "hausgemachte Tomatensauce | Mozzarella di Bufala Campana D.O.P | Basilikum"],
  ["Spianata*", "11,5", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | pikante kalabrische Salami"],
  ["Diavola", "12", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | pikante kalabrische Salami | Peperoncini"],
  ["Salame di Manzo*", "13", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | 100% Rinder-Salami (Metzgerei Harth)"],
  ["Parma e Rucola", "14,5", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | Rucola | Prosciutto di Parma D.O.P"],
  ["Rucola e Pomodorini", "12", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | Rucola | Cherrytomaten | Grana Padano"],
  ["Prosciutto e Funghi", "12", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | italienischer Kochschinken | Pilze"],
  ["Napoli", "11", "hausgemachte Tomatensauce | handgearbeitete Sardellen | Oliven | Kapern"],
  ["Tonno Giallo", "13,5", "gelbe Kirschtomaten vom Vesuv | Mozzarella aus Kampanien | Gelbflossen Thunfischfilets | rote Zwiebeln | Pfeffer"],
  ["Ortolana", "11", "hausgemachte Tomatensauce | Mozzarella aus Kampanien | Zucchini | Aubergine | Paprika"],
  ["Mortadella", "14", "Mozzarella aus Kampanien | Mortadella | Stracciatella | Pistazien"],
  ["Salsiccia Friarielli", "15", "Provola affumicata | kalabrische Salsiccia | Friarielli"],
  ["Patate e Cipolle", "11,5", "Mozzarella aus Kampanien | Kartoffel | Rosmarin | rote Zwiebel"],
  ["Salame e Pepe", "12,5", "Provola affumicata | Grana Padano | Spianata | Basilikum | Pfeffer"],
  ["Latte e Miele", "14,5", "Mozzarella aus Kampanien | Mortadella | Mozzarella di Bufala Campana D.O.P. | Honig | Basilikum"],
  ["Panouzzo (Pizzabrot)", "5", "Olivenöl | Oregano | Salz"],
  ["Dolce Vita", "12,5", "Nutella | Erdbeere oder Banane | auf Wunsch mit Pistazie | Buenocreme oder Lotuscreme +1 €, Pistaziencreme +2 €"]
];
const PIZZA_NOTE = "*Vor Ort als „ruota di carro“ (36cm) erhältlich +1,5€";

const PASTA = [
  ["Lasagna tradizionale", "14,9", "Hausgemachtes Bolognese Ragù | Hausgemachte Bechamel | Fior di Latte | Grana Padano"],
  ["Ricotta e Spinaci", "14,9", "Hausgemachte Bechamel | Ricotta | Spinat | Grana Padano | Fior di Latte"]
];
const INSALATE = [
  ["Insalata di Pomodoro", "7,5", "Tomate | rote Zwiebel (optional mit Thunfisch +3.5€)"],
  ["Insalata Mista", "8,5", "Gemischter Salat | Tomate | Gurke | rote Zwiebel | Karotte | Paprika | Mais"],
  ["Insalata Tonno", "13", "Gemischter Salat | Tomate | Gurke | rote Zwiebel | Karotte | Paprika | Mais | Thunfischfilet | schwarze Olive | Ei"],
  ["Insalata Avocado", "12,5", "Gemischter Salat | Tomate | Gurke | Paprika | Avocado | schwarze Olive | Schafskäse"],
  ["Insalata Rucola", "13", "Rucola | Cherrytomaten | Pinienkerne | Grana Padano D.O.P."],
  ["Bufala Caprese", "13,5", "Tomaten | Mozzarella di Bufala Campana D.O.P | Basilikum | Olivenöl"]
];
const DRINKS = [
  ["Softdrinks", "3,5"], ["Wasser", "3"], ["Wasser 0,5", "4"], ["Eistee 0,33L", "3,5"], ["Bier 0,5L", "4,5"],
  ["ital. Bier 0,33L", "4"], ["Aperitif", "5"], ["Weinschorle 0,3L", "4"], ["Wein 0,375L", "13,5"]
];

const rad = d => d * Math.PI / 180;
function makeRand(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

function wrap(ctx, text, maxW) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function canvas(w, h, scale) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.textBaseline = "alphabetic";
  return { cv, ctx };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}

function olives(ctx, w, h, seed, alpha = .28) {
  const r = makeRand(seed);
  ctx.save();
  ctx.strokeStyle = `rgba(120,150,95,${alpha})`;
  ctx.lineWidth = 1.6;
  const n = Math.round(w * h / 60000) + 3;
  for (let b = 0; b < n; b++) {
    let x = r() * w, y = r() * h, a = r() * Math.PI * 2;
    const len = 8 + Math.floor(r() * 8);
    ctx.beginPath(); ctx.moveTo(x, y);
    const pts = [];
    for (let i = 0; i < len; i++) {
      a += (r() - .5) * .5;
      x += Math.cos(a) * 22; y += Math.sin(a) * 22;
      ctx.lineTo(x, y); pts.push([x, y, a]);
    }
    ctx.stroke();
    pts.forEach(([px, py, pa], i) => {
      const side = i % 2 ? 1 : -1;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(pa + side * .9);
      ctx.beginPath(); ctx.ellipse(18, 0, 18, 5, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(32, 0); ctx.stroke();
      ctx.restore();
      if (r() < .3) {
        ctx.beginPath(); ctx.ellipse(px + side * 10, py + 12, 9, 12, pa, 0, Math.PI * 2); ctx.stroke();
      }
    });
  }
  ctx.restore();
}

function logo(ctx, cx, baseY, px, ink, green, glow) {
  const letters = ["L", "A", "O", "L", "I", "V", "A"];
  ctx.font = `300 ${px}px ${F_LOGO}`;
  const sp = px * .3, oW = px * .74;
  const widths = letters.map(l => l === "O" ? oW : ctx.measureText(l).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (letters.length - 1);
  let x = cx - total / 2;
  const cap = px * .7;
  const passes = glow ? 2 : 1;
  for (let p = 0; p < passes; p++) {
    let xx = x;
    letters.forEach((l, i) => {
      if (glow) { ctx.shadowColor = l === "O" ? green : glow; ctx.shadowBlur = p ? 12 : 34; }
      if (l === "O") {
        const r = cap * .52, ocx = xx + oW / 2, ocy = baseY - cap / 2;
        ctx.strokeStyle = green; ctx.lineWidth = px * .075;
        ctx.beginPath(); ctx.arc(ocx, ocy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = px * .045;
        ctx.beginPath(); ctx.moveTo(ocx, ocy - r); ctx.quadraticCurveTo(ocx + r * .05, ocy - r * 1.3, ocx + r * .2, ocy - r * 1.45); ctx.stroke();
        ctx.save();
        ctx.translate(ocx + r * .62, ocy - r * 1.42);
        ctx.rotate(rad(-18));
        ctx.beginPath(); ctx.ellipse(0, 0, r * .42, r * .17, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      } else {
        ctx.fillStyle = ink;
        ctx.fillText(l, xx, baseY);
      }
      xx += widths[i] + sp;
    });
  }
  ctx.shadowBlur = 0;
  return total;
}

function drawPizzaBoard() {
  const W = 1600, H = 560;
  const { cv, ctx } = canvas(W, H, 2);
  ctx.fillStyle = "#f2f3ef"; ctx.fillRect(0, 0, W, H);
  olives(ctx, W, H, 11);
  logo(ctx, 210, 70, 58, INK, GREEN);
  ctx.font = `400 17px ${F_LOGO}`; ctx.fillStyle = "#555"; ctx.textAlign = "center";
  ctx.fillText("PIZZERIA  DAL  2020", 210, 98);
  ctx.textAlign = "center"; ctx.fillStyle = "#1e1e1e"; ctx.font = `700 84px ${F_HEAD}`;
  ctx.fillText("PIZZE", W / 2, 88);
  ctx.textAlign = "right"; ctx.font = `500 19px ${F_ITEM}`; ctx.fillStyle = "#333";
  ctx.fillText(PIZZA_NOTE, W - 36, 84);
  ctx.textAlign = "left";

  const bx = 18, by = 112, bw = W - 36, bh = H - by - 16;
  ctx.fillStyle = "rgba(255,255,255,.55)";
  roundRect(ctx, bx, by, bw, bh, 16); ctx.fill();
  ctx.strokeStyle = GREEN; ctx.lineWidth = 6; ctx.stroke();

  const cols = [PIZZE.slice(0, 5), PIZZE.slice(5, 10), PIZZE.slice(10, 15), PIZZE.slice(15, 20)];
  const colW = (bw - 40) / 4, inner = colW - 28;
  let k = 1;
  const measure = kk => {
    let maxH = 0;
    for (const col of cols) {
      ctx.font = `500 ${17 * kk}px ${F_ITEM}`;
      let h = 0;
      for (const it of col) h += 27 * kk + wrap(ctx, it[2], inner).length * 20 * kk + 13 * kk;
      maxH = Math.max(maxH, h);
    }
    return maxH;
  };
  k = 1.3;
  while (measure(k) > bh - 30 && k > .6) k -= .02;
  cols.forEach((col, ci) => {
    const x0 = bx + 22 + ci * colW;
    let y = by + 18;
    for (const it of col) {
      ctx.font = `600 ${24 * k}px ${F_ITEM}`; ctx.fillStyle = "#1c1c1c";
      y += 24 * k;
      ctx.fillText(it[0], x0, y);
      ctx.textAlign = "right"; ctx.fillText(it[1], x0 + inner, y); ctx.textAlign = "left";
      y += 3 * k;
      ctx.font = `500 ${17 * k}px ${F_ITEM}`; ctx.fillStyle = DESC;
      for (const l of wrap(ctx, it[2], inner)) { y += 20 * k; ctx.fillText(l, x0, y); }
      y += 13 * k;
    }
    if (ci > 0) {
      ctx.strokeStyle = "rgba(108,191,85,.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0 - 14, by + 22); ctx.lineTo(x0 - 14, by + bh - 22); ctx.stroke();
    }
  });
  return cv;
}

function chalkBg(ctx, W, H, seed) {
  ctx.fillStyle = "#26352c"; ctx.fillRect(0, 0, W, H);
  const r = makeRand(seed);
  for (let i = 0; i < 260; i++) {
    ctx.strokeStyle = `rgba(255,255,255,${r() * .05})`;
    ctx.lineWidth = 8 + r() * 30;
    ctx.beginPath();
    const x = r() * W, y = r() * H;
    ctx.moveTo(x, y); ctx.lineTo(x + (r() - .5) * 160, y + (r() - .5) * 40);
    ctx.stroke();
  }
}

function drawChalkboard() {
  const W = 760, H = 600;
  const { cv, ctx } = canvas(W, H, 2.6);
  chalkBg(ctx, W, H, 4);
  const chalk = "#f3f0e6", yellow = "#ffe27a", soft = "rgba(243,240,230,.82)";
  let k = 1.15;
  const layout = (draw) => {
    let y = 0;
    const head = t => {
      ctx.font = `700 ${62 * k}px ${F_HEAD}`; y += 60 * k;
      if (draw) {
        ctx.fillStyle = chalk; ctx.textAlign = "center"; ctx.fillText(t, W / 2, y); ctx.textAlign = "left";
        ctx.strokeStyle = "rgba(243,240,230,.6)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(W / 2 - 90, y + 8); ctx.quadraticCurveTo(W / 2, y + 16, W / 2 + 90, y + 6); ctx.stroke();
      }
      y += 18 * k;
    };
    const item = (it, x, w, yy) => {
      let iy = yy;
      ctx.font = `700 ${30 * k}px ${F_CHALK}`; iy += 28 * k;
      if (draw) {
        ctx.fillStyle = chalk; ctx.fillText(it[0], x, iy);
        ctx.fillStyle = yellow; ctx.textAlign = "right"; ctx.fillText(it[1], x + w, iy); ctx.textAlign = "left";
      }
      ctx.font = `400 ${22 * k}px ${F_CHALK}`;
      for (const l of wrap(ctx, it[2], w)) { iy += 22 * k; if (draw) { ctx.fillStyle = soft; ctx.fillText(l, x, iy); } }
      return iy + 12 * k;
    };
    y += 4;
    head("PASTA");
    const pw = (W - 90) / 2;
    const p1 = item(PASTA[0], 30, pw, y), p2 = item(PASTA[1], 60 + pw, pw, y);
    y = Math.max(p1, p2) + 4 * k;
    head("INSALATE");
    let yl = y, yr = y;
    INSALATE.forEach((it, i) => {
      if (i % 2 === 0) yl = item(it, 30, pw, yl); else yr = item(it, 60 + pw, pw, yr);
    });
    y = Math.max(yl, yr) + 6 * k;
    ctx.font = `700 ${26 * k}px ${F_CHALK}`;
    y += 24 * k;
    if (draw) {
      ctx.fillStyle = chalk; ctx.textAlign = "center";
      ctx.fillText("Dressings zur Auswahl  ·  Hausdressing  oder  Essig + Öl", W / 2, y);
      ctx.textAlign = "left";
    }
    return y + 14;
  };
  while (layout(false) > H && k > .6) k -= .02;
  layout(true);
  return cv;
}

function drawDrinks() {
  const W = 420, H = 560;
  const { cv, ctx } = canvas(W, H, 2.6);
  ctx.fillStyle = "#f2f3ef"; ctx.fillRect(0, 0, W, H);
  olives(ctx, W, H, 23);
  ctx.fillStyle = "#1e1e1e"; ctx.textAlign = "center"; ctx.font = `700 76px ${F_HEAD}`;
  ctx.fillText("GETRÄNKE", W / 2, 76);
  const bx = 18, by = 96, bw = W - 36, bh = 378;
  ctx.fillStyle = "rgba(255,255,255,.6)"; roundRect(ctx, bx, by, bw, bh, 14); ctx.fill();
  ctx.strokeStyle = GREEN; ctx.lineWidth = 5; ctx.stroke();
  ctx.font = `500 27px ${F_ITEM}`; ctx.fillStyle = "#1c1c1c";
  DRINKS.forEach((d, i) => {
    const y = by + 44 + i * 39;
    ctx.textAlign = "left"; ctx.fillText(d[0], bx + 22, y);
    ctx.textAlign = "right"; ctx.fillText(d[1], bx + bw - 22, y);
  });
  ctx.textAlign = "center"; ctx.fillStyle = "#222";
  ctx.font = `600 26px ${F_ITEM}`; ctx.fillText("www.laoliva.de", W / 2, 516);
  ctx.font = `500 17px ${F_ITEM}`; ctx.fillText("Allergene und Zusatzstoffe separat gelistet", W / 2, 542);
  return cv;
}

function drawTagline() {
  const W = 1100, H = 115;
  const { cv, ctx } = canvas(W, H, 2);
  ctx.fillStyle = "#f2f3ef"; ctx.fillRect(0, 0, W, H);
  olives(ctx, W, H, 31, .22);
  ctx.fillStyle = "#151515"; ctx.textAlign = "center";
  ctx.font = `34px ${F_SCRIPT}`;
  ctx.fillText("Handverlesene Zutaten direkt von Produzenten aus Italien", W / 2, 48);
  ctx.fillText("& Leidenschaft für neapolitanisches Handwerk", W / 2, 94);
  return cv;
}

function drawAFrame() {
  const W = 360, H = 500;
  const { cv, ctx } = canvas(W, H, 2.6);
  chalkBg(ctx, W, H, 9);
  ctx.textAlign = "center";
  logo(ctx, W / 2, 72, 44, "#f3f0e6", GREEN);
  ctx.font = `400 14px ${F_LOGO}`; ctx.fillStyle = "#e8e4d8";
  ctx.fillText("PIZZERIA  DAL  2020", W / 2, 96);
  ctx.strokeStyle = GREEN; ctx.lineWidth = 3;
  roundRect(ctx, 22, 118, W - 44, 92, 12); ctx.stroke();
  ctx.fillStyle = "#ffe27a"; ctx.font = `700 31px ${F_CHALK}`;
  ctx.fillText("Schüler und Studenten", W / 2, 156);
  ctx.fillText("erhalten 10% Rabatt", W / 2, 192);
  ctx.fillStyle = "#f3f0e6"; ctx.font = `700 28px ${F_HEAD}`;
  ctx.fillText("ANRUFEN  ·  ABHOLEN  ·  GENIESSEN", W / 2, 250);
  ctx.font = `700 30px ${F_CHALK}`;
  ctx.fillText("Tel. 06131 2106696", W / 2, 290);
  ctx.font = `400 25px ${F_CHALK}`;
  ctx.fillText("Montag bis Samstag", W / 2, 336);
  ctx.fillText("11.30 bis 15.00 Uhr", W / 2, 364);
  ctx.fillText("und 17.00 bis 22.00 Uhr", W / 2, 392);
  ctx.fillText("Sonntag 13.00 bis 21.00 Uhr", W / 2, 428);
  ctx.font = `700 24px ${F_CHALK}`; ctx.fillStyle = "#cfe8c4";
  ctx.fillText("@laoliva.official", W / 2, 474);
  return cv;
}

function drawNeon() {
  const W = 1100, H = 300;
  const { cv, ctx } = canvas(W, H, 2);
  ctx.textBaseline = "alphabetic";
  logo(ctx, W / 2, 225, 165, "#fffdf2", "#7dff5c", "#fff3b0");
  logo(ctx, W / 2, 225, 165, "#ffffff", "#a8ff8c", null);
  return cv;
}

function drawSubline() {
  const W = 800, H = 70;
  const { cv, ctx } = canvas(W, H, 2);
  ctx.fillStyle = "#f4efe2"; ctx.textAlign = "center"; ctx.font = `400 44px ${F_LOGO}`;
  ctx.fillText("PIZZERIA  DAL  2020", W / 2, 50);
  ctx.strokeStyle = "#f4efe2"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(40, 34); ctx.lineTo(150, 34); ctx.moveTo(W - 150, 34); ctx.lineTo(W - 40, 34); ctx.stroke();
  return cv;
}

function plain(w, h, fn) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const c = cv.getContext("2d");
  fn(c, w, h);
  return cv;
}

function drawTiles() {
  return plain(512, 512, (c) => {
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      c.fillStyle = (x + y) % 2 ? "#c9643f" : "#efe6d2";
      c.fillRect(x * 64, y * 64, 64, 64);
    }
    c.strokeStyle = "rgba(0,0,0,.12)"; c.lineWidth = 2;
    for (let i = 0; i <= 8; i++) { c.beginPath(); c.moveTo(i * 64, 0); c.lineTo(i * 64, 512); c.moveTo(0, i * 64); c.lineTo(512, i * 64); c.stroke(); }
  });
}

function drawGrass() {
  return plain(512, 512, (c) => {
    c.fillStyle = "#6aa84f"; c.fillRect(0, 0, 512, 512);
    const r = makeRand(3);
    for (let i = 0; i < 6000; i++) {
      c.fillStyle = r() < .5 ? "rgba(40,90,30,.25)" : "rgba(170,220,120,.18)";
      c.fillRect(r() * 512, r() * 512, 2, 4);
    }
  });
}

function drawPavement() {
  return plain(512, 512, (c) => {
    c.fillStyle = "#b9b4aa"; c.fillRect(0, 0, 512, 512);
    c.strokeStyle = "rgba(60,55,50,.35)"; c.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { c.beginPath(); c.moveTo(i * 128, 0); c.lineTo(i * 128, 512); c.moveTo(0, i * 128); c.lineTo(512, i * 128); c.stroke(); }
  });
}

function drawStripes() {
  return plain(512, 64, (c) => {
    for (let i = 0; i < 16; i++) { c.fillStyle = i % 2 ? "#f6f4ec" : "#4f9a3f"; c.fillRect(i * 32, 0, 32, 64); }
  });
}

function drawPizzaTop() {
  return plain(256, 256, (c) => {
    c.fillStyle = "#e3b56b"; c.beginPath(); c.arc(128, 128, 126, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#c33a22"; c.beginPath(); c.arc(128, 128, 104, 0, Math.PI * 2); c.fill();
    const r = makeRand(8);
    for (let i = 0; i < 9; i++) { c.fillStyle = "#fbf6e8"; c.beginPath(); c.arc(70 + r() * 116, 70 + r() * 116, 12 + r() * 8, 0, Math.PI * 2); c.fill(); }

function heart(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * .3);
  c.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  c.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  c.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  c.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
  c.fill();
}

    const legR = limb(cfg.legMats, 0.25, 0.95, cfg.legW, 0.95, 0.42);
    const armL = limb(cfg.armMats, -(cfg.tw / 2 + 0.24), 1.88, 0.46, 0.95, 0.44);
    const armR = limb(cfg.armMats, cfg.tw / 2 + 0.24, 1.88, 0.46, 0.95, 0.44);
    return { g, legL, legR, armL, armR, head };
  }

  const skinMat = lam(SKIN);
  const shirtSide = T(drawShirtSide());
  const shirtMat = (cv) => new THREE.MeshLambertMaterial({ map: T(cv) });
  const heartsTex = T(drawHearts());
  heartsTex.wrapS = heartsTex.wrapT = THREE.RepeatWrapping;
  const heartsMat = new THREE.MeshLambertMaterial({ map: heartsTex });
  const legSkin = new THREE.MeshLambertMaterial({ map: T(drawHairyLeg()) });
  const hairMat = lam("#2a1c12");

  const me = figure({
    tw: 1.06, td: 0.6,
    torsoMats: [new THREE.MeshLambertMaterial({ map: shirtSide }), new THREE.MeshLambertMaterial({ map: shirtSide }), skinMat, heartsMat, shirtMat(drawUndershirt(true)), shirtMat(drawUndershirt(false))],
    headMats: [skinMat, skinMat, hairMat, skinMat, new THREE.MeshLambertMaterial({ map: T(drawFace(false)) }), skinMat],
    legMats: [legSkin, legSkin, skinMat, skinMat, legSkin, legSkin],
    legW: 0.44,
    armMats: skinMat
  });
  const player = me.g;
  const hairTop = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.12, 0.64), hairMat);
  hairTop.position.y = 2.5; player.add(hairTop);
  for (let i = 0; i < 5; i++) {
    const tuft = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.14), hairMat);
    tuft.position.set(-0.24 + i * 0.12, 2.6 + (i % 2) * 0.05, -0.1 + (i % 3) * 0.12);
    tuft.rotation.z = (i - 2) * 0.2;
    player.add(tuft);
  }
  const band = new THREE.Mesh(new THREE.BoxGeometry(1.08, 0.16, 0.62), heartsMat);
  band.position.y = 0.95; player.add(band);
  const sockMat = lam("#f4f4f4"), slipMat = lam("#1f3f8a"), strapMat = lam("#f4f4f4");
  for (const leg of [me.legL, me.legR]) {
    const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.42, 0.5), heartsMat);
    shorts.position.y = -0.2; leg.add(shorts);
    const sock = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.24, 0.44), sockMat);
    sock.position.y = -0.8; leg.add(sock);
    const slip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.07, 0.66), slipMat);
    slip.position.set(0, -0.92, 0.07); leg.add(slip);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.08, 0.22), strapMat);
    strap.position.set(0, -0.86, 0.14); leg.add(strap);
  }
  player.position.set(0, 0, BD + 11);
  player.rotation.y = Math.PI;
  scene.add(player);

  const jacket = new THREE.MeshLambertMaterial({ color: "#fbfbf8" });
  const checks = T(drawChecks()); checks.wrapS = checks.wrapT = THREE.RepeatWrapping; checks.repeat.set(2, 3);
  const checkMat = new THREE.MeshLambertMaterial({ map: checks });
  const chef = figure({
    tw: 1.0, td: 0.55,
    torsoMats: [jacket, jacket, jacket, jacket, new THREE.MeshLambertMaterial({ map: T(drawChefJacket(true)) }), jacket],
    headMats: [skinMat, skinMat, skinMat, skinMat, new THREE.MeshLambertMaterial({ map: T(drawFace(true)) }), skinMat],
    legMats: checkMat,
    legW: 0.46,
    armMats: jacket
  });
  chef.g.position.set(0, 0, -5.7);
  scene.add(chef.g);
  collide(-0.8, 0.8, -6.3, -5.1);
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.32, 20), jacket);
  hat.position.y = 2.6; chef.g.add(hat);
  const puff = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 12), jacket);
  puff.position.y = 2.82; puff.scale.set(1, 0.5, 1); chef.g.add(puff);
  const scarf = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.62), lam("#c8282d"));
  scarf.position.y = 1.86; chef.g.add(scarf);
  for (const arm of [chef.armL, chef.armR]) {
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.34), skinMat);
    hand.position.y = -1.02; arm.add(hand);
  }
  const dough = new THREE.Group();
  const disk = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.04, 36), lam("#f2e2bc"));
  dough.add(disk);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.06, 10, 36), lam("#e6cc94"));
  rim.rotation.x = Math.PI / 2; dough.add(rim);
  for (let i = 0; i < 6; i++) {
    const spot = new THREE.Mesh(new THREE.CircleGeometry(0.06, 8), lam("#d9b878"));
    spot.rotation.x = -Math.PI / 2;
    spot.position.set(Math.cos(i) * 0.35, 0.025, Math.sin(i * 1.7) * 0.35);
    dough.add(spot);
  }
  chef.g.add(dough);

  let yaw = 0, pitch = 0.14, dist = 7;
  let vy = 0, grounded = true, walkT = 0;
  const keys = {};
  addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Space") e.preventDefault(); });
  addEventListener("keyup", e => { keys[e.code] = false; });
  const startEl = document.getElementById("start");
  document.getElementById("loading").style.display = "none";
  startEl.style.display = "flex";
  startEl.addEventListener("click", () => renderer.domElement.requestPointerLock());
  document.addEventListener("pointerlockchange", () => { startEl.style.display = document.pointerLockElement ? "none" : "flex"; });
  addEventListener("mousemove", e => {
    if (!document.pointerLockElement) return;
    yaw -= e.movementX * 0.0025;
    pitch = Math.min(1.2, Math.max(-0.45, pitch + e.movementY * 0.0025));
  });
  addEventListener("wheel", e => { dist = Math.min(14, Math.max(2.5, dist + e.deltaY * 0.01)); });
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
  const tgt = new THREE.Vector3(), off = new THREE.Vector3();
  const rc = new THREE.Raycaster();
  const PR = 0.45;
  let time = 0;

  function loop() {
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    right.set(Math.cos(yaw), 0, -Math.sin(yaw));
    move.set(0, 0, 0);
    if (keys.KeyW || keys.ArrowUp) move.add(fwd);
    if (keys.KeyS || keys.ArrowDown) move.sub(fwd);
    if (keys.KeyD || keys.ArrowRight) move.add(right);
    if (keys.KeyA || keys.ArrowLeft) move.sub(right);
    const moving = move.lengthSq() > 0;
    if (moving) {
      move.normalize();
      const sp = keys.ShiftLeft || keys.ShiftRight ? 10 : 5.5;
      player.position.addScaledVector(move, sp * dt);
      let d = Math.atan2(move.x, move.z) - player.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      player.rotation.y += d * Math.min(1, dt * 12);
      walkT += dt * sp * 1.4;
    }
    for (let it = 0; it < 2; it++) {
      for (const b of boxes) {
        const px = player.position.x, pz = player.position.z;
        if (px > b.minX - PR && px < b.maxX + PR && pz > b.minZ - PR && pz < b.maxZ + PR) {
          const l = px - (b.minX - PR), r = (b.maxX + PR) - px, f = pz - (b.minZ - PR), k = (b.maxZ + PR) - pz;
          const m = Math.min(l, r, f, k);
          if (m === l) player.position.x -= l;
          else if (m === r) player.position.x += r;
          else if (m === f) player.position.z -= f;
          else player.position.z += k;
        }
      }
    }
    player.position.x = Math.max(-150, Math.min(150, player.position.x));
    player.position.z = Math.max(-150, Math.min(150, player.position.z));

    if (keys.Space && grounded) { vy = 9; grounded = false; }
    vy -= 25 * dt;
    player.position.y += vy * dt;
    if (player.position.y <= 0) { player.position.y = 0; vy = 0; grounded = true; }

    const swing = moving && grounded ? Math.sin(walkT) * 0.7 : 0;
    me.legL.rotation.x = swing; me.legR.rotation.x = -swing;
    me.armL.rotation.x = -swing; me.armR.rotation.x = swing;
    if (!grounded) me.armL.rotation.x = me.armR.rotation.x = -2.6;

    const toss = Math.pow(Math.max(0, Math.sin(time * 1.6)), 2) * 0.35;
    chef.armL.rotation.x = Math.PI - 0.05 + Math.sin(time * 9) * 0.04;
    chef.armR.rotation.x = Math.PI - 0.05 - Math.sin(time * 9) * 0.04;
    chef.armL.rotation.z = -0.22; chef.armR.rotation.z = 0.22;
    dough.position.set(0, 3.3 + toss, 0);
    dough.rotation.y += dt * 9;
    dough.rotation.x = Math.sin(time * 2.3) * 0.12;
    dough.rotation.z = Math.cos(time * 1.9) * 0.1;
    chef.head.rotation.y = Math.sin(time * 0.7) * 0.25;

    tgt.set(player.position.x, player.position.y + 2.3, player.position.z);
    off.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).normalize();
    rc.set(tgt, off); rc.far = dist;
    const hits = rc.intersectObjects(solids, false);
    let d2 = dist;
    if (hits.length) d2 = Math.max(0.6, hits[0].distance - 0.3);
    camera.position.copy(tgt).addScaledVector(off, d2);
    if (camera.position.y < 0.3) camera.position.y = 0.3;
    camera.lookAt(tgt);

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
}

init();
</script>
</body>
</html>
